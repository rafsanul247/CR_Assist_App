name: cr_assist
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  android_intent_plus: ^5.3.0
  dio: ^5.11.1
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  dartz: ^0.10.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  get_it: ^9.2.1
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  connectivity_plus: ^7.3.1
  pretty_dio_logger: ^1.4.0
  flutter_screenutil: ^5.9.3
  get: ^4.7.3
  equatable: ^2.1.0
  iconsax_flutter: ^1.0.0
  url_launcher: ^6.3.2
  file_picker: ^12.2.0
  lucide_icons_flutter: ^3.1.19
  cross_file: ^0.3.5+5
  intl: ^0.20.2
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  flutter_native_splash: ^2.4.8
  pinput: ^5.0.1
  smooth_page_indicator: ^1.1.0



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/icons/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon_black.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#0A0E17"
  adaptive_icon_foreground: "assets/icons/app_icon_black.png"
